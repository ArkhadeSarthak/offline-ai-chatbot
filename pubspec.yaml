name: local_mind
description: "High-performance offline AI model downloader and chat interface."
publish_to: 'none'
version: 1.1.5

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.5
  google_fonts: ^6.1.0
  image_picker: ^1.0.7
  shared_preferences: ^2.5.5
  path_provider: ^2.1.2
  dio: ^5.4.0
  provider: ^6.1.2
  llama_cpp_dart: ^0.2.1
  crypto: ^3.0.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^2.0.1

flutter:
  uses-material-design: true
  assets:
    - assets/images/Icon.png
